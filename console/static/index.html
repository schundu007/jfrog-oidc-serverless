<!doctype html>
<html lang="en" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JFrog OIDC Console</title>
  <link rel="stylesheet" href="/static/styles.css">
  <!-- render-blocking: the first paint already has this page's sidebar and panel, no flash between pages -->
  <script type="module" src="/static/app.js" blocking="render"></script>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <a class="brand" href="/" data-section title="Home"><svg class="logo" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 1.5l7.4 4.25v8.5L10 18.5l-7.4-4.25v-8.5z"/><path class="logo-in" d="M10 6l3.5 2v4L10 14l-3.5-2V8z"/></svg><span>JFrog OIDC <b class="brand-accent">Console</b></span></a>
    <span class="pill bad" id="session-state" hidden></span>
  </header>
  <aside class="sidenav"><script src="/static/shell.js"></script></aside>
  <div class="main-col">

  <div id="auth-banner" class="banner error" role="alert" hidden>
    <p>Not signed in. Paste the console URL (it ends in #t=…). If the console was started in the background,
      get it with <code>python3 -m console --print-url</code>.</p>
    <form id="auth-form" class="auth-form" autocomplete="off">
      <input id="auth-input" type="password" spellcheck="false" autocomplete="off" aria-label="Console link"
        placeholder="http://127.0.0.1:8765/#t=…">
      <button type="submit" class="primary">Sign in</button>
    </form>
  </div>

  <main>
    <div class="page-top">
      <a class="topbar-back" id="nav-home" href="/" data-section data-portal hidden title="Home"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h5v-6h4v6h5V9.5"/></svg><span>Home</span></a>
      <nav class="trail" id="trail" aria-label="You are here"></nav>
    </div>
    <div id="page"></div>
  </main>

  <aside id="flyout" class="flyout" role="dialog" aria-labelledby="flyout-title" hidden>
    <div class="flyout-head">
      <h2 id="flyout-title"></h2>
      <span id="flyout-status"></span>
      <button type="button" id="flyout-close" class="icon-btn" aria-label="Close panel" title="Close"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg></button>
    </div>
    <div id="flyout-body" class="flyout-body"></div>
  </aside>

  <!-- Workloads (/<cloud>) -->
  <template id="tpl-list">
    <header class="blade-head">
      <h1>Serverless</h1>
      <span class="blade-sub">Azure and Google Cloud <span id="wl-help"></span></span>
    </header>
    <div class="blade-cmds" role="toolbar" aria-label="Serverless">
      <button id="wl-create" type="button" class="blade-cmd" aria-expanded="false" aria-controls="wl-create-panel"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg>Create</button>
      <button id="wl-refresh" type="button" class="blade-cmd"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 10a6 6 0 1 1-1.8-4.3M16 4v3.5h-3.5"/></svg>Refresh</button>
      <span id="list-status" class="page-status small" role="status" aria-live="polite"></span>
    </div>
    <div id="wl-create-panel" class="ov-create wl-create-panel" hidden></div>
    <div id="wl-filters"></div>
    <p id="wl-count" class="blade-count"></p>
    <div class="table-scroll"><table class="blade-table wl-table">
      <thead><tr><th scope="col">Name</th><th scope="col">Status</th><th scope="col">Type</th><th scope="col">Location</th>
        <th scope="col">Resource group</th><th scope="col">Subscription / project</th><th scope="col">Cloud</th></tr></thead>
      <tbody id="wl-rows"></tbody>
    </table></div>
    <p id="wl-empty" class="blade-empty" hidden></p>
  </template>

  <!-- New workload (/<cloud>/new) -->
  <template id="tpl-new">
    <header class="page-header">
      <div class="title-row"><h1>New workload</h1></div>
      <div class="actions">
        <button type="button" id="cfg-save" class="cmd primary-cmd" data-lock><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 3h10l3 3v11H4z"/><path d="M7 3v5h6V3M7 17v-5h7v5"/></svg>Save</button>
        <button type="button" id="cfg-preflight" class="cmd secondary" data-lock><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10.5l4 4 8-9"/></svg>Preflight</button>
        <a id="new-cancel" class="btn secondary">Cancel</a>
        <span id="cfg-status" class="page-status small" role="status" aria-live="polite"></span>
      </div>
    </header>
    <div id="cfg-mount"></div>
  </template>

  <!-- Workload (/<cloud>/w/<name>): Runs · Configuration · Simulator -->
  <template id="tpl-workload">
    <header class="page-header">
      <div class="title-row"><h1 id="wl-title"></h1><span id="wl-pill"></span></div>
      <p id="wl-facts" class="facts"></p>
      <div class="actions" id="wl-actions">
        <button type="button" id="wl-run" class="cmd primary-cmd" data-lock><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 4l10 6-10 6z"/></svg>Run pipeline</button>
        <button type="button" id="cfg-preflight" class="cmd secondary" data-lock><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10.5l4 4 8-9"/></svg>Preflight</button>
        <span id="wl-menu"></span>
        <span id="cfg-status" class="page-status small" role="status" aria-live="polite"></span>
      </div>
    </header>
    <div id="approval-banner" class="approval" role="status" hidden></div>
    <nav class="tabs" role="tablist" aria-label="Workload">
      <a role="tab" id="tab-runs" data-tab="runs" aria-controls="panel-runs">Runs <span id="runs-count" class="count-badge"></span></a>
      <a role="tab" id="tab-config" data-tab="config" aria-controls="panel-config">Configuration</a>
      <a role="tab" id="tab-sim" data-tab="sim" aria-controls="panel-sim">Simulator</a>
    </nav>
    <section id="panel-runs" class="tab-panel" role="tabpanel" aria-labelledby="tab-runs" hidden>
      <div class="toolbar" role="toolbar" aria-label="Runs">
        <button type="button" id="runs-refresh" class="cmd secondary"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 10a6 6 0 11-1.8-4.3M16 3v4h-4"/></svg>Refresh</button>
        <button type="button" id="runs-clear" class="cmd secondary">Clear finished</button>
        <span id="runs-status" class="page-status small" role="status" aria-live="polite"></span>
      </div>
      <div class="table-card" id="runs-card">
        <table class="list-table runs-table">
          <thead><tr><th scope="col" class="col-icon"><span class="sr-only">Status</span></th><th scope="col">Run</th>
            <th scope="col">Started</th><th scope="col" class="num">Duration</th><th scope="col">Steps</th>
            <th scope="col" class="col-menu"><span class="sr-only">Actions</span></th></tr></thead>
          <tbody id="runs-rows"></tbody>
        </table>
      </div>
      <div id="runs-empty" class="empty" hidden>
        <h2 data-help="Run pipeline checks, simulates and plans before anything changes.">No runs yet</h2>
      </div>
    </section>
    <section id="panel-config" class="tab-panel" role="tabpanel" aria-labelledby="tab-config" hidden>
      <div class="toolbar" role="toolbar" aria-label="Configuration">
        <button type="button" id="cfg-save" class="cmd secondary" data-lock><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 3h10l3 3v11H4z"/><path d="M7 3v5h6V3M7 17v-5h7v5"/></svg>Save</button>
        <span id="cfg-dirty" class="small" aria-live="polite"></span>
      </div>
      <div id="cfg-mount"></div>
    </section>
    <section id="panel-sim" class="tab-panel" role="tabpanel" aria-labelledby="tab-sim" hidden>
      <div id="sim-mount"></div>
    </section>
  </template>

  <!-- Run (/<cloud>/w/<name>/runs/<id>): step tree next to the step's detail and log -->
  <template id="tpl-run">
    <header class="page-header">
      <div class="title-row"><h1 id="run-title"></h1><span id="run-pill"></span></div>
      <p id="run-facts" class="facts"></p>
      <div class="actions" id="run-actions">
        <button type="button" id="run-cancel" class="cmd secondary danger" hidden>Cancel run</button>
        <button type="button" id="run-delete" class="cmd secondary danger" hidden>Delete run</button>
        <span id="run-status" class="page-status small" role="status" aria-live="polite"></span>
      </div>
    </header>
    <div class="run-layout">
      <nav class="card step-tree" aria-label="Steps">
        <ol id="run-steps" class="steps"></ol>
      </nav>
      <section class="card step-pane" aria-live="polite">
        <div id="run-detail"></div>
        <div class="log-head">
          <h3>Log <span id="run-log-count" class="count-badge"></span></h3>
          <button type="button" id="run-log-copy" class="cmd secondary small-btn">Copy</button>
        </div>
        <div id="run-log" class="run-log" tabindex="0" aria-label="Step log"></div>
      </section>
    </div>
  </template>

  <!-- The configuration form (New workload, and the Configuration tab). Step cards are always open. -->
  <template id="tpl-config">
    <form id="cfg-form" class="cfg-form" novalidate autocomplete="off" aria-label="Configuration">
      <ol class="rail">
      <li class="rail-step" id="step-app">
        <h2><span class="step-n" aria-hidden="true">1</span> Target workload</h2>
        <div class="step-body">
        <div class="grid2" id="cfg-pick">
          <label class="field"><span id="cfg-scope-label">Project</span><select id="cfg-scope"><option value="">Loading…</option></select></label>
          <label class="field"><span>Workload <button type="button" id="cfg-inv-refresh" class="link inv-refresh">Refresh</button></span><select id="cfg-workload"><option value="">Loading workloads…</option></select></label>
        </div>
        <div class="grid2">
          <label class="field"><span>Workload type</span><select id="cfg-kind" data-path="target.kind"></select></label>
          <label class="field"><span>Configuration name</span><input data-path="name" type="text" spellcheck="false" autocomplete="off" placeholder="from the workload"></label>
        </div>
        <div class="grid3" data-cloud="gcp">
          <label class="field"><span>Project ID</span><input data-path="target.gcp.project" type="text" spellcheck="false"></label>
          <label class="field"><span>Region</span><input data-path="target.gcp.region" type="text" spellcheck="false"></label>
          <label class="field"><span>Name</span><input data-path="target.gcp.name" type="text" spellcheck="false"></label>
        </div>
        <div class="grid3" data-cloud="azure">
          <label class="field"><span>Subscription ID</span><input data-path="target.azure.subscription" type="text" spellcheck="false"></label>
          <label class="field"><span>Resource group</span><input data-path="target.azure.resource_group" type="text" spellcheck="false"></label>
          <label class="field"><span>Name</span><input data-path="target.azure.name" type="text" spellcheck="false"></label>
        </div>
        <div class="grid3" data-cloud="aws">
          <label class="field"><span>Account ID</span><input data-path="target.aws.account" type="text" spellcheck="false" inputmode="numeric"></label>
          <label class="field"><span>Region</span><input data-path="target.aws.region" type="text" spellcheck="false"></label>
          <label class="field"><span>Name</span><input data-path="target.aws.name" type="text" spellcheck="false"></label>
        </div>
        <div class="grid2" data-cloud="aws">
          <label class="field"><span>AWS profile</span><input data-path="target.aws.profile" type="text" spellcheck="false" placeholder="default"></label>
          <label class="field" data-kinds="aws_ecs_task"><span>ECS cluster</span><input data-path="target.aws.cluster" type="text" spellcheck="false" placeholder="none: register the task definition only"></label>
        </div>
        <div class="grid2" data-cloud="openshift">
          <input data-path="target.openshift.context" type="hidden">
          <label class="field"><span>Cluster name</span><input data-path="target.openshift.cluster" type="text" spellcheck="false"></label>
          <label class="field"><span>Namespace</span><input data-path="target.openshift.namespace" type="text" spellcheck="false"></label>
        </div>
        <div class="grid2" data-cloud="openshift">
          <label class="field"><span>Knative service</span><input data-path="target.openshift.name" type="text" spellcheck="false"></label>
        </div>
        <div class="find-row">
          <button type="button" id="cfg-discover-btn" class="cmd secondary" data-lock><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5"/><path d="M12.5 12.5L17 17"/></svg>Discover identity</button>
          <span id="cfg-identity" class="identity small"></span>
        </div>
        <div id="cfg-discover" class="result-box" hidden aria-live="polite"></div>
        </div>
      </li>

      <li class="rail-step" id="step-jfrog">
        <h2><span class="step-n" aria-hidden="true">2</span> JFrog platform</h2>
        <div class="step-body">
        <div class="grid2">
          <label class="field"><span>Platform URL</span><input data-path="jfrog.url" type="url" spellcheck="false" placeholder="https://yourcompany.jfrog.io"></label>
          <label class="field"><span>Reader group</span><input data-path="jfrog.reader_group" type="text" spellcheck="false"></label>
        </div>
        </div>
      </li>

      <li class="rail-step" id="step-needs">
        <h2><span class="step-n" aria-hidden="true">3</span> Token paths</h2>
        <div class="step-body">
        <label class="choice">
          <input data-path="runtime.enabled" type="checkbox">
          <span><b>Runtime token exchange</b></span>
        </label>
        </div>
      </li>
      </ol>
    </form>
    <section id="cfg-problems" class="card problems" hidden aria-live="polite"></section>
  </template>

  <!-- Simulator tab -->
  <template id="tpl-sim">
    <div class="sim-layout">
      <form id="sim-form" class="controls card" novalidate aria-label="Simulation settings">
        <div class="sim-bar">
          <label class="field"><span>Scenario</span><select id="scenario" required></select></label>
          <label class="field"><span>Duration</span>
            <select id="duration"><option>6h</option><option>12h</option><option selected>24h</option><option>48h</option></select>
          </label>
          <div id="scenario-meta" class="small"></div>
        </div>
        <details class="advanced" id="sim-advanced">
          <summary>Advanced</summary>
          <div class="sim-adv-grid">
          <fieldset>
            <legend>Overrides</legend>
            <div id="overrides" class="grid2"></div>
          </fieldset>
          <fieldset>
            <legend>Faults</legend>
            <div id="faults" class="faults"></div>
            <div class="row">
              <select id="add-fault-type" aria-label="Fault type to add"></select>
              <button type="button" id="add-fault" class="secondary">Add fault</button>
            </div>
          </fieldset>
          <fieldset>
            <legend>Load</legend>
            <div id="load"></div>
            <label class="field"><span>Seed</span><input id="seed" type="number" min="0" step="1" value="1"></label>
          </fieldset>
          </div>
        </details>
        <div class="row sim-actions">
          <button id="run" type="submit" class="primary">Run simulation</button>
          <button id="reset" type="button" class="secondary">Reset</button>
        </div>
        <div id="progress" class="progress" hidden aria-live="polite">
          <div class="track"><div class="bar" id="progress-bar"></div></div>
          <span id="progress-text" class="small muted"></span>
        </div>
        <p id="form-error" class="error small" role="alert" hidden></p>
      </form>

      <div class="results" id="sim-results" hidden>
        <section id="verdict" class="card verdict" aria-live="polite"></section>
        <section class="card">
          <div class="card-head"><h2>Timeline</h2><div id="legend" class="legend" aria-label="Legend"></div></div>
          <div id="timeline" class="timeline"></div>
        </section>
        <section class="card events-box" id="events-box">
          <div class="card-head">
            <h2 id="ev-title">Events</h2>
            <select id="ev-type" aria-label="Filter by event kind"><option value="">All kinds</option></select>
            <input id="ev-search" type="search" placeholder="Filter text" aria-label="Filter events by text">
            <span id="ev-count" class="small muted"></span>
          </div>
          <div class="table-wrap">
            <table id="events">
              <thead><tr><th scope="col">Time</th><th scope="col">Kind</th><th scope="col">Detail</th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </section>
      </div>
    </div>
  </template>
  </div>
</div>
</body>
</html>
