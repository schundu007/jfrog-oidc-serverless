# AKS cluster: plan -> approve -> apply (or destroy) terraform/stacks/kubernetes/azure/aks-cluster only.
# The apply waits for approval on the ADO environment aks-cluster-<environment>.
trigger: none
pr: none

parameters:
  - name: action
    type: string
    default: apply
    values: [apply, destroy]
  - name: environment
    type: string
    default: test
    values: [test]
  # The stack's variables as JSON, as the Infrastructure page saves them (.console/setup/<env>/aks-cluster.tfvars.json).
  - name: inputs
    type: object
    default: {}
  # Where state lives: this cloud's foundation inputs it derives from.
  - name: state
    type: object
    default: {}

extends:
  template: /pipelines/templates/azure-stack-setup.yml
  parameters:
    stack: aks-cluster
    action: ${{ parameters.action }}
    environment: ${{ parameters.environment }}
    inputs: ${{ parameters.inputs }}
    state: ${{ parameters.state }}
