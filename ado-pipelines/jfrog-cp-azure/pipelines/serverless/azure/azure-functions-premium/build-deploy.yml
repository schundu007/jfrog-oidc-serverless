# Functions Premium / Dedicated: build and roll out this one workload (stack azure-functions-premium). Nothing else is touched.
trigger: none
pr: none

parameters:
  - name: environment
    type: string
    default: test
    values: [test]
  - name: workload
    displayName: Workload name (the stack's workload input)
    type: string
    default: func-prem-jfrog-demo

extends:
  template: /pipelines/templates/azure-build-deploy.yml
  parameters:
    kind: functions-premium
    workload: ${{ parameters.workload }}
    environment: ${{ parameters.environment }}
