# Azure pipelines, test environment: JFrog repository names. Read only by the JFrog OIDC
# runs (build-deploy, onboarding, the JFrog OIDC stacks); infrastructure runs never include it.
# Created by terraform/stacks/oidc/azure/azure-jfrog-trust (repositories.tf): keep the keys equal.
variables:
  JFROG_DOCKER_REMOTE: azure-docker-remote
  JFROG_PYPI_REPO: azure-pypi-remote
  JFROG_MAVEN_REPO: azure-maven-remote
  JFROG_NUGET_REPO: azure-nuget-remote
