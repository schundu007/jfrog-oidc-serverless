<!doctype html>
<html lang="en" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Runs · JFrog OIDC Console</title>
  <link rel="stylesheet" href="/serverless/static/styles.css">
  <link rel="stylesheet" href="/dashboard.css">
  <link rel="stylesheet" href="/serverless/static/azure.css">
  <script type="module" src="/runs-page.js"></script>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <a class="brand" href="/"><svg class="logo" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 1.5l7.4 4.25v8.5L10 18.5l-7.4-4.25v-8.5z"/><path class="logo-in" d="M10 6l3.5 2v4L10 14l-3.5-2V8z"/></svg><span>JFrog OIDC <b class="brand-accent">Console</b></span></a>
    <span class="pill bad" id="session-state" hidden></span>
  </header>
  <aside class="sidenav"><script src="/serverless/static/shell.js"></script></aside>
  <div class="main-col">
  <main id="dash" class="home runs-page">
    <header class="home-title">
      <span class="home-logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h9"/><path d="m16 16 3 2-3 2z"/></svg></span>
      <h1>Runs</h1>
    </header>
    <div class="blade-cmds" role="toolbar" aria-label="Runs">
      <button id="runs-refresh" type="button" class="blade-cmd"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 10a6 6 0 1 1-1.8-4.3M16 4v3.5h-3.5"/></svg>Refresh</button>
      <button id="runs-delete" type="button" class="blade-cmd" disabled><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 6h10M8 6V4h4v2M6.5 6l.7 10h5.6l.7-10"/></svg><span>Delete selected</span></button>
      <button id="runs-clear" type="button" class="blade-cmd"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 5h12M4 10h8M4 15h5M13 13l4 4M17 13l-4 4"/></svg>Clear finished</button>
    </div>
    <p id="runs-errors" class="error-box" role="alert" hidden></p>
    <div id="runs-confirm" class="runs-confirm" role="alertdialog" aria-labelledby="runs-confirm-text" hidden>
      <span id="runs-confirm-text"></span>
      <button type="button" id="runs-confirm-yes" class="btn danger">Delete</button>
      <button type="button" id="runs-confirm-no" class="btn secondary">Keep</button>
    </div>
    <p id="runs-done" class="muted small" role="status" hidden></p>
    <section class="ess" aria-labelledby="ess-h">
      <button type="button" class="ess-fold" id="ess-h" aria-expanded="true" aria-controls="ess-body">Essentials</button>
      <div class="ess-body" id="ess-body">
        <dl class="ess-col" id="ess-left"></dl>
        <dl class="ess-col" id="ess-right"></dl>
      </div>
    </section>
    <div class="tabs" role="tablist" aria-label="Runs">
      <button type="button" role="tab" id="tab-all" aria-controls="runs-panel" data-tab="">All</button>
      <button type="button" role="tab" id="tab-serverless" aria-controls="runs-panel" data-tab="serverless">Serverless</button>
      <button type="button" role="tab" id="tab-kubernetes" aria-controls="runs-panel" data-tab="kubernetes">Kubernetes</button>
      <button type="button" role="tab" id="tab-infrastructure" aria-controls="runs-panel" data-tab="infrastructure">Infrastructure</button>
      <button type="button" role="tab" id="tab-oidc" aria-controls="runs-panel" data-tab="oidc">JFrog OIDC</button>
    </div>
    <div id="runs-panel" role="tabpanel">
      <div id="runs-filters"></div>
      <p id="runs-count" class="blade-count"></p>
      <div class="table-wrap"><table class="blade-table home-table list-table">
        <thead><tr><th scope="col" class="sel"><input type="checkbox" id="runs-all" aria-label="Select all finished runs shown"></th><th scope="col">Name</th><th scope="col">Status</th><th scope="col">Type</th><th scope="col">Started</th></tr></thead>
        <tbody id="runs-rows"></tbody>
      </table></div>
      <p id="runs-none" class="blade-empty" hidden></p>
    </div>
  </main>
  </div>
</div>
</body>
</html>
