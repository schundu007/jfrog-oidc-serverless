<!doctype html>
<html lang="en" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings · JFrog OIDC Console</title>
  <link rel="stylesheet" href="/serverless/static/styles.css">
  <link rel="stylesheet" href="/dashboard.css">
  <link rel="stylesheet" href="/serverless/static/azure.css">
  <script type="module" src="/settings-page.js"></script>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <a class="brand" href="/"><svg class="logo" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 1.5l7.4 4.25v8.5L10 18.5l-7.4-4.25v-8.5z"/><path class="logo-in" d="M10 6l3.5 2v4L10 14l-3.5-2V8z"/></svg><span>JFrog OIDC <b class="brand-accent">Console</b></span></a>
    <span class="pill bad" id="session-state" hidden></span>
  </header>
  <aside class="sidenav"><script src="/serverless/static/shell.js"></script></aside>
  <div class="main-col">
  <main id="dash" class="home settings-page">
    <header class="home-title">
      <h1>Settings</h1>
    </header>
    <div class="blade-cmds" role="toolbar" aria-label="Settings">
      <button id="set-refresh" type="button" class="blade-cmd"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 10a6 6 0 1 1-1.8-4.3M16 4v3.5h-3.5"/></svg>Refresh</button>
    </div>
    <p id="set-error" class="error-box" role="alert" hidden></p>
    <div id="set-cards" class="conn-grid" aria-busy="true"></div>
  </main>
  </div>
</div>
</body>
</html>
