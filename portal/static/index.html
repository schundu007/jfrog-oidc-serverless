<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JFrog OIDC Console</title>
  <link rel="stylesheet" href="/serverless/static/styles.css">
  <link rel="stylesheet" href="/dashboard.css">
  <script type="module" src="/dashboard.js" blocking="render"></script>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <a class="brand" href="/"><svg class="logo" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 1.5l7.4 4.25v8.5L10 18.5l-7.4-4.25v-8.5z"/><path class="logo-in" d="M10 6l3.5 2v4L10 14l-3.5-2V8z"/></svg><span>JFrog OIDC Console</span></a>
    <span class="pill bad" id="session-state" hidden></span>
  </header>
  <aside class="sidenav">
    <nav aria-label="Home">
      <a class="nav-item" href="/" aria-current="page"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h5v-6h4v6h5V9.5"/></svg><span>Home</span></a>
    </nav>
    <nav aria-label="Serverless">
      <div class="nav-group">Serverless</div>
      <a class="nav-item" href="/serverless/gcp"><svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.2 18.6h9.6a4.4 4.4 0 0 0 .5-8.8A5.9 5.9 0 0 0 6 9.2a4.7 4.7 0 0 0 1.2 9.4z" pathLength="100" fill="none" stroke="#ea4335" stroke-width="2.2" stroke-dasharray="25 75" stroke-dashoffset="0"/><path d="M7.2 18.6h9.6a4.4 4.4 0 0 0 .5-8.8A5.9 5.9 0 0 0 6 9.2a4.7 4.7 0 0 0 1.2 9.4z" pathLength="100" fill="none" stroke="#fbbc04" stroke-width="2.2" stroke-dasharray="25 75" stroke-dashoffset="-25"/><path d="M7.2 18.6h9.6a4.4 4.4 0 0 0 .5-8.8A5.9 5.9 0 0 0 6 9.2a4.7 4.7 0 0 0 1.2 9.4z" pathLength="100" fill="none" stroke="#34a853" stroke-width="2.2" stroke-dasharray="25 75" stroke-dashoffset="-50"/><path d="M7.2 18.6h9.6a4.4 4.4 0 0 0 .5-8.8A5.9 5.9 0 0 0 6 9.2a4.7 4.7 0 0 0 1.2 9.4z" pathLength="100" fill="none" stroke="#4285f4" stroke-width="2.2" stroke-dasharray="25 75" stroke-dashoffset="-75"/></svg><span>Google Cloud</span></a>
      <a class="nav-item" href="/serverless/azure"><svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.7 3.2h4.5L7.9 20.8H3.2z" fill="#0062ad"/><path d="M14.8 7.4l6 13.4H9.6l4-1.6-3.6-.2z" fill="#2a95e8"/></svg><span>Azure</span></a>
    </nav>
    <nav aria-label="Kubernetes">
      <div class="nav-group">Kubernetes</div>
      <a class="nav-item" href="/k8s/clusters/aks"><svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.7 3.2h4.5L7.9 20.8H3.2z" fill="#0062ad"/><path d="M14.8 7.4l6 13.4H9.6l4-1.6-3.6-.2z" fill="#2a95e8"/></svg><span>Azure AKS</span></a>
      <a class="nav-item" href="/k8s/clusters/gke"><svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.2 18.6h9.6a4.4 4.4 0 0 0 .5-8.8A5.9 5.9 0 0 0 6 9.2a4.7 4.7 0 0 0 1.2 9.4z" pathLength="100" fill="none" stroke="#ea4335" stroke-width="2.2" stroke-dasharray="25 75" stroke-dashoffset="0"/><path d="M7.2 18.6h9.6a4.4 4.4 0 0 0 .5-8.8A5.9 5.9 0 0 0 6 9.2a4.7 4.7 0 0 0 1.2 9.4z" pathLength="100" fill="none" stroke="#fbbc04" stroke-width="2.2" stroke-dasharray="25 75" stroke-dashoffset="-25"/><path d="M7.2 18.6h9.6a4.4 4.4 0 0 0 .5-8.8A5.9 5.9 0 0 0 6 9.2a4.7 4.7 0 0 0 1.2 9.4z" pathLength="100" fill="none" stroke="#34a853" stroke-width="2.2" stroke-dasharray="25 75" stroke-dashoffset="-50"/><path d="M7.2 18.6h9.6a4.4 4.4 0 0 0 .5-8.8A5.9 5.9 0 0 0 6 9.2a4.7 4.7 0 0 0 1.2 9.4z" pathLength="100" fill="none" stroke="#4285f4" stroke-width="2.2" stroke-dasharray="25 75" stroke-dashoffset="-75"/></svg><span>Google GKE</span></a>
      <a class="nav-item" href="/k8s/clusters/eks"><svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><text x="12" y="12" text-anchor="middle" font-size="8.6" font-weight="700" font-family="Arial, Helvetica, sans-serif" fill="currentColor">aws</text><path d="M4 15.2c4.7 3 11.3 3.2 16 .2" fill="none" stroke="#ff9900" stroke-width="2" stroke-linecap="round"/><path d="M17.3 14l3 .9-.9 3" fill="none" stroke="#ff9900" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>AWS EKS</span></a>
      <a class="nav-item" href="/k8s/clusters/openshift"><svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="#e00" stroke-width="3.4"/><path class="cut" d="M2.5 10.2l19-4.6M2.5 17.6l19-4.6" fill="none" stroke-width="1.8"/></svg><span>OpenShift</span></a>
    </nav>
  </aside>
  <div class="main-col">
  <main id="dash">
    <div class="dash-head"><h1>Home</h1><button type="button" id="dash-refresh" class="cmd secondary"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 10a6 6 0 11-1.8-4.3M16 3v4h-4"/></svg>Refresh</button></div>
    <section class="dash-sec" aria-labelledby="h-sl">
      <div class="dash-sec-head"><h2 id="h-sl">Serverless</h2></div>
      <div class="kpis" id="sl-kpis"></div>
      <div class="dash-cols">
        <div id="sl-clouds" class="tiles"></div>
        <div class="panel"><h3 class="panel-title">Recent runs</h3><div id="sl-runs" class="dash-list"></div></div>
      </div>
    </section>
    <section class="dash-sec" aria-labelledby="h-k8s">
      <div class="dash-sec-head"><h2 id="h-k8s">Kubernetes</h2></div>
      <div class="kpis" id="k8s-kpis"></div>
      <div class="dash-cols">
        <div id="k8s-plats" class="tiles"></div>
        <div class="panel"><h3 class="panel-title">Clusters</h3><div id="k8s-clusters" class="dash-list"></div></div>
      </div>
    </section>
  </main>
  </div>
</div>
</body>
</html>
