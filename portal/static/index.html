<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JFrog OIDC Console</title>
  <link rel="stylesheet" href="/serverless/static/styles.css">
  <link rel="stylesheet" href="/dashboard.css">
  <script type="module" src="/dashboard.js" blocking="render"></script>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <a class="brand" href="/"><svg class="logo" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 1.5l7.4 4.25v8.5L10 18.5l-7.4-4.25v-8.5z"/><path class="logo-in" d="M10 6l3.5 2v4L10 14l-3.5-2V8z"/></svg><span>JFrog OIDC <b class="brand-accent">Console</b></span></a>
    <span class="pill bad" id="session-state" hidden></span>
  </header>
  <aside class="sidenav"><script src="/serverless/static/shell.js"></script></aside>
  <div class="main-col">
  <main id="dash">
    <section class="hero" aria-label="Overview">
      <div class="hero-top"><h1>Home</h1><button type="button" id="dash-refresh" class="cmd hero-btn"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 10a6 6 0 11-1.8-4.3M16 3v4h-4"/></svg>Refresh</button></div>
      <div class="hero-stats">
        <div class="hstat mint"><span class="sbadge" id="ring-wl"><svg class="sicon" viewBox="0 0 32 32" aria-hidden="true"><rect x="4" y="6" width="24" height="20" rx="1" class="s-line"/><path d="M4 11h24" class="s-line"/><path d="M17.5 13.5l-5 6.5h4l-1.5 5 5-6.5h-4z" class="s-fill"/></svg><b id="hs-wl-ok" class="sr-only">–</b></span><span><b id="hs-wl">–</b><small>Workloads</small></span></div>
        <div class="hstat sky"><span class="sbadge" id="ring-cl"><svg class="sicon" viewBox="0 0 32 32" aria-hidden="true"><polygon points="16.00,3.00 26.16,7.89 28.67,18.89 21.64,27.71 10.36,27.71 3.33,18.89 5.84,7.89" class="s-line"/><circle cx="16" cy="16" r="7.5" class="s-line"/><g class="s-line"><path d="M16 16L16.00 8.50"/><path d="M16 16L21.86 11.32"/><path d="M16 16L23.31 17.67"/><path d="M16 16L19.25 22.76"/><path d="M16 16L12.75 22.76"/><path d="M16 16L8.69 17.67"/><path d="M16 16L10.14 11.32"/></g><circle cx="16" cy="16" r="2.6" class="s-fill"/></svg><b id="hs-cl-ok" class="sr-only">–</b></span><span><b id="hs-cl">–</b><small>Clusters</small></span></div>
        <div class="hstat lilac"><span class="sbadge"><svg class="sicon" viewBox="0 0 32 32" aria-hidden="true"><rect x="2.5" y="11" width="8" height="10" class="s-line"/><rect x="12" y="11" width="8" height="10" class="s-line"/><rect x="21.5" y="11" width="8" height="10" class="s-fill"/><path d="M10.5 16h1.5M20 16h1.5" class="s-line"/></svg></span><span><b id="hs-runs">–</b><small>Runs</small></span></div>
        <div class="hstat peach"><span class="sbadge"><svg class="sicon" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="11" class="s-soft"/><path d="M16 5a11 11 0 1 1-11 11" class="s-arc"/><path d="M14 12l6 4-6 4z" class="s-fill"/></svg></span><span><b id="hs-live">–</b><small>In progress</small></span></div>
      </div>
    </section>
    <p id="dash-errors" class="error-box" role="alert" hidden></p>
    <!-- One board per cloud: its workloads and clusters together, as the sidebar groups them. -->
    <div class="bento" id="clouds"></div>
    <section class="board board-wide" aria-labelledby="h-runs">
      <header class="board-head"><h2 id="h-runs">Recent runs</h2><a class="board-link" href="/runs">All runs</a></header>
      <div id="recent-runs"></div>
    </section>
  </main>
  </div>
</div>
</body>
</html>
