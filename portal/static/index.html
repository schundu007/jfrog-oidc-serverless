<!doctype html>
<html lang="en" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JFrog OIDC Console</title>
  <link rel="stylesheet" href="/serverless/static/styles.css">
  <link rel="stylesheet" href="/dashboard.css">
  <link rel="stylesheet" href="/serverless/static/azure.css">
  <script type="module" src="/dashboard.js" blocking="render"></script>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <a class="brand" href="/"><svg class="logo" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 1.5l7.4 4.25v8.5L10 18.5l-7.4-4.25v-8.5z"/><path class="logo-in" d="M10 6l3.5 2v4L10 14l-3.5-2V8z"/></svg><span>JFrog OIDC <b class="brand-accent">Console</b></span></a>
    <span class="pill bad" id="session-state" hidden></span>
  </header>
  <aside class="sidenav"><script src="/serverless/static/shell.js"></script></aside>
  <div class="main-col">
  <main id="dash" class="home">
    <header class="home-title">
      <span class="home-logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h5v-6h4v6h5V9.5"/></svg></span>
      <h1>Home</h1>
    </header>
    <div class="blade-cmds" role="toolbar" aria-label="Home">
      <button id="dash-refresh" type="button" class="blade-cmd"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 10a6 6 0 1 1-1.8-4.3M16 4v3.5h-3.5"/></svg>Refresh</button>
      <a class="blade-cmd" href="/serverless/"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg>Onboard a workload</a>
      <a class="blade-cmd" href="/runs"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 6h12M4 10h12M4 14h7"/></svg>All runs</a>
      <span id="session-state" class="page-status small" hidden></span>
    </div>
    <p id="dash-errors" class="error-box" role="alert" hidden></p>
    <section class="ess" aria-labelledby="ess-h">
      <button type="button" class="ess-fold" id="ess-h" aria-expanded="true" aria-controls="ess-body">Essentials</button>
      <div class="ess-body" id="ess-body">
        <dl class="ess-col" id="ess-left"></dl>
        <dl class="ess-col" id="ess-right"></dl>
      </div>
    </section>
    <div class="tabs" role="tablist" aria-label="Home">
      <button type="button" role="tab" id="tab-serverless" aria-controls="home-panel" data-tab="serverless">Serverless</button>
      <button type="button" role="tab" id="tab-app-services" aria-controls="home-panel" data-tab="app-services">App Services</button>
    </div>
    <div id="home-panel" role="tabpanel">
      <div id="home-filters"></div>
      <p id="home-count" class="blade-count"></p>
      <div class="table-wrap"><table class="blade-table home-table"><thead id="home-head"></thead><tbody id="home-rows"></tbody></table></div>
      <p id="home-empty" class="blade-empty" hidden></p>
    </div>
  </main>
  </div>
</div>
</body>
</html>
