# Web App: build and deploy this one workload's code (stack azure-web-app). Its runtime tags
# (Python, Java, .NET, Node.js or PHP) pick the build; packages come only through JFrog. Nothing else is touched.
trigger: none
pr: none

parameters:
  - name: environment
    type: string
    default: test
    values: [test]
  - name: workload
    displayName: Workload name (the stack's workload input)
    type: string
    default: " "
  - name: slot
    displayName: Deployment slot (empty = production)
    type: string
    default: " "
  - name: swap
    displayName: Swap the slot into production after it answers /health
    type: boolean
    default: false

extends:
  template: /pipelines/templates/azure-build-deploy.yml
  parameters:
    kind: webapp
    workload: ${{ trim(parameters.workload) }}
    environment: ${{ parameters.environment }}
    slot: ${{ trim(parameters.slot) }}
    swap: ${{ parameters.swap }}
