# Source deploy for a Cloud Run function (gen2), keeping the identity and JFrog
# settings the console wired. No image: Cloud Functions builds the source.
# The login comes from the service connection's OIDC token (no stored secrets).
# Trust: terraform/stacks/gcp-foundation and jfrog-ado-trust. Infrastructure: pipelines/gcp-stack-setup.yml.

trigger:
  batch: true   # pushes during a run wait for it, so CI runs never deploy the function at once
  branches:
    include: [main]
  paths:
    include: [apps/cloud-run-function, client/src, pipelines/gcp-function-deploy.yml, pipelines/scripts/gcp-build-deploy.sh, pipelines/scripts/oidc-login.sh]

pr: none

parameters:
  - name: environment
    type: string
    default: test
    values: [test]

variables:
  - template: vars/${{ parameters.environment }}.yml
  - name: KIND
    value: function
  - name: APP
    value: cloud-run-function
  - name: WORKLOAD
    value: jfrog-fn-demo

pool:
  vmImage: ubuntu-24.04

jobs:
  - job: build_deploy
    displayName: Deploy
    timeoutInMinutes: 30
    steps:
      - checkout: self
        fetchDepth: 1
      - task: AzureCLI@2
        displayName: Deploy (OIDC)
        inputs:
          azureSubscription: ${{ variables.BUILD_SERVICE_CONNECTION }}
          scriptType: bash
          scriptLocation: scriptPath
          scriptPath: pipelines/scripts/gcp-build-deploy.sh
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          JFROG_OIDC_ADO_SERVICE_CONNECTION_ID: $(BUILD_SERVICE_CONNECTION_ID)
          GCP_SERVICE_ACCOUNT: $(GCP_BUILD_SERVICE_ACCOUNT)
