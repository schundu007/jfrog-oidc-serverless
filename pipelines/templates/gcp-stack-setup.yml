# Template: plan -> apply (or destroy) for ONE Google Cloud stack (a serverless workload or the test cluster).
# Used only by pipelines/{serverless,kubernetes}/gcp/<stack>/stack-setup.yml, one pipeline per stack.
# Infrastructure only: no JFrog token, provider or variable (JFrog OIDC is configured afterwards,
# outside these runs). The setup service connection's OIDC token gives GCP through WIF. The apply stage targets the ADO
# environment "<stack>-<environment>" (approval) and applies exactly the reviewed plan file;
# action=destroy plans `terraform plan -destroy` and applies that the same way.

parameters:
  - name: stack
    type: string
  - name: action
    type: string
  - name: environment
    type: string
  - name: inputs
    type: object
  - name: state
    type: object

variables:
  - template: /pipelines/vars/gcp-${{ parameters.environment }}.yml
  - group: jfrog-oidc-gcp-${{ parameters.environment }}
  - name: PLAN_FILE
    value: $(Pipeline.Workspace)/plan/tfplan
  - name: PLAN_ACTION
    ${{ if eq(parameters.action, 'destroy') }}:
      value: plan-destroy
    ${{ else }}:
      value: plan

stages:
  - stage: plan
    displayName: Plan ${{ parameters.action }} ${{ parameters.stack }}
    jobs:
      - job: plan
        pool:
          vmImage: ubuntu-24.04
        timeoutInMinutes: 30
        steps:
          - checkout: self
            fetchDepth: 1
          - bash: pipelines/scripts/install-terraform.sh
            displayName: Install Terraform $(TERRAFORM_VERSION)
          - bash: mkdir -p "$(Pipeline.Workspace)/plan"
            displayName: Prepare
          # ADO issues the connection's OIDC token only to a job that references it; this
          # skipped task is that reference. Nothing signs in to Azure.
          - task: AzureCLI@2
            displayName: Reference the service connection
            condition: false
            inputs:
              azureSubscription: ${{ variables.SETUP_SERVICE_CONNECTION }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: 'true'
          - bash: bash pipelines/scripts/terraform-stack.sh $(PLAN_ACTION) ${{ parameters.stack }} ${{ parameters.environment }} $(PLAN_FILE)
            name: tf
            displayName: terraform ${{ parameters.action }} plan (OIDC)
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
              JFROG_OIDC_ADO_SERVICE_CONNECTION_ID: $(SETUP_SERVICE_CONNECTION_ID)
              STACK_INPUTS: ${{ convertToJson(parameters.inputs) }}
              STACK_STATE: ${{ convertToJson(parameters.state) }}
              GCP_SERVICE_ACCOUNT: $(GCP_SETUP_SERVICE_ACCOUNT)
          - publish: $(Pipeline.Workspace)/plan
            artifact: plan
            condition: and(succeeded(), eq(variables['tf.hasChanges'], 'true'))

  - stage: apply
    displayName: Apply
    dependsOn: plan
    condition: and(succeeded(), eq(dependencies.plan.outputs['plan.tf.hasChanges'], 'true'))
    jobs:
      - deployment: apply
        pool:
          vmImage: ubuntu-24.04
        environment: ${{ parameters.stack }}-${{ parameters.environment }}
        timeoutInMinutes: 60
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  fetchDepth: 1
                - download: current
                  artifact: plan
                - bash: pipelines/scripts/install-terraform.sh
                  displayName: Install Terraform $(TERRAFORM_VERSION)
                # ADO issues the connection's OIDC token only to a job that references it; this
                # skipped task is that reference. Nothing signs in to Azure.
                - task: AzureCLI@2
                  displayName: Reference the service connection
                  condition: false
                  inputs:
                    azureSubscription: ${{ variables.SETUP_SERVICE_CONNECTION }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: 'true'
                - bash: bash pipelines/scripts/terraform-stack.sh apply ${{ parameters.stack }} ${{ parameters.environment }} $(PLAN_FILE)
                  displayName: terraform apply (OIDC)
                  env:
                    SYSTEM_ACCESSTOKEN: $(System.AccessToken)
                    JFROG_OIDC_ADO_SERVICE_CONNECTION_ID: $(SETUP_SERVICE_CONNECTION_ID)
                    STACK_INPUTS: ${{ convertToJson(parameters.inputs) }}
                    STACK_STATE: ${{ convertToJson(parameters.state) }}
                    GCP_SERVICE_ACCOUNT: $(GCP_SETUP_SERVICE_ACCOUNT)
