# Template: build and roll out ONE Google Cloud serverless workload.
# Used only by pipelines/{serverless,app-services}/gcp/<stack>/build-deploy.yml, one pipeline per workload type.
# Base images come through JFrog; every login comes from the service connection's OIDC token
# (no stored secrets).

parameters:
  - name: kind
    type: string
  - name: workload
    type: string
  - name: environment
    type: string

variables:
  - template: /pipelines/vars/gcp-${{ parameters.environment }}.yml
  - template: /pipelines/vars/gcp-${{ parameters.environment }}-jfrog.yml
  - group: jfrog-oidc-gcp-${{ parameters.environment }}
  # JFrog OIDC (written by gcp-jfrog-trust, after the infrastructure): JFROG_URL, JFROG_OIDC_PROVIDER.
  - group: jfrog-oidc-gcp-${{ parameters.environment }}-jfrog
  - name: BASE_IMAGE
    value: library/python:3.12-slim

jobs:
  - job: rollout
    # AGENT_POOL in vars/<cloud>-<env>.yml: a self-hosted pool; empty: Microsoft-hosted ubuntu-24.04
    ${{ if ne(variables.AGENT_POOL, '') }}:
      pool:
        name: ${{ variables.AGENT_POOL }}
    ${{ else }}:
      pool:
        vmImage: ubuntu-24.04
    displayName: Cloud Run ${{ parameters.kind }} ${{ parameters.workload }}
    timeoutInMinutes: 30
    variables:
      KIND: ${{ parameters.kind }}
      WORKLOAD: ${{ parameters.workload }}
      ${{ if eq(parameters.kind, 'job') }}:
        APP: artifact-reader
      ${{ if eq(parameters.kind, 'service') }}:
        APP: cloud-run-service
      ${{ if eq(parameters.kind, 'function') }}:
        APP: cloud-run-function
      ${{ if eq(parameters.kind, 'worker-pool') }}:
        APP: cloud-run-worker-pool
      ${{ if eq(parameters.kind, 'app-engine') }}:
        APP: cloud-run-service
    steps:
      - checkout: self
        fetchDepth: 1
      - ${{ if eq(parameters.workload, '') }}:
          - bash: echo "##vso[task.logissue type=error]Fill in the workload name when you run this pipeline." && exit 1
            displayName: Workload name
      # ADO issues the connection's OIDC token only to a job that references it; this
      # skipped task is that reference. Nothing signs in to Azure.
      - task: AzureCLI@2
        displayName: Reference the service connection
        condition: false
        inputs:
          azureSubscription: ${{ variables.BUILD_SERVICE_CONNECTION }}
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: 'true'
      - bash: bash pipelines/scripts/gcp-build-deploy.sh
        displayName: Roll out $(WORKLOAD) (OIDC)
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          JFROG_OIDC_ADO_SERVICE_CONNECTION_ID: $(BUILD_SERVICE_CONNECTION_ID)
          GCP_SERVICE_ACCOUNT: $(GCP_BUILD_SERVICE_ACCOUNT)
