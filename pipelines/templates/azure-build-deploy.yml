# Template: build and roll out ONE Azure serverless workload.
# Used only by pipelines/serverless/azure/<stack>/build-deploy.yml, one pipeline per workload type.
# Base images come through JFrog; every login comes from the service connection's OIDC token
# (no stored secrets).

parameters:
  - name: kind
    type: string
  - name: workload
    type: string
  - name: environment
    type: string
  # Web App only: deploy into this deployment slot instead of production; swap it in afterwards.
  - name: slot
    type: string
    default: ""
  - name: swap
    type: boolean
    default: false

variables:
  - template: /pipelines/vars/azure-${{ parameters.environment }}.yml
  - template: /pipelines/vars/azure-${{ parameters.environment }}-jfrog.yml
  - group: jfrog-oidc-azure-${{ parameters.environment }}
  # JFrog OIDC (written by azure-jfrog-trust, after the infrastructure): JFROG_URL, JFROG_OIDC_PROVIDER.
  - group: jfrog-oidc-azure-${{ parameters.environment }}-jfrog
  - name: KIND
    value: ${{ parameters.kind }}
  - name: WORKLOAD
    value: ${{ parameters.workload }}
  - name: SLOT
    value: ${{ parameters.slot }}
  - name: SWAP
    value: ${{ parameters.swap }}

jobs:
  - job: build_deploy
    # AGENT_POOL in vars/<cloud>-<env>.yml: a self-hosted pool; empty: Microsoft-hosted ubuntu-24.04
    ${{ if ne(variables.AGENT_POOL, '') }}:
      pool:
        name: ${{ variables.AGENT_POOL }}
    ${{ else }}:
      pool:
        vmImage: ubuntu-24.04
    displayName: Roll out ${{ parameters.kind }} ${{ parameters.workload }}
    timeoutInMinutes: 30
    steps:
      - checkout: self
        fetchDepth: 1
      - ${{ if eq(parameters.workload, '') }}:
          - bash: echo "##vso[task.logissue type=error]Fill in the workload name when you run this pipeline." && exit 1
            displayName: Workload name
      - task: AzureCLI@2
        displayName: Roll out ${{ parameters.kind }} ${{ parameters.workload }} (OIDC)
        inputs:
          azureSubscription: ${{ variables.BUILD_SERVICE_CONNECTION }}
          scriptType: bash
          scriptLocation: scriptPath
          scriptPath: pipelines/scripts/azure-build-deploy.sh
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          JFROG_OIDC_ADO_SERVICE_CONNECTION_ID: $(BUILD_SERVICE_CONNECTION_ID)
