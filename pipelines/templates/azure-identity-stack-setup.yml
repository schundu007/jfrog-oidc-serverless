# Template: plan -> apply (or destroy) for terraform/stacks/serverless/azure/azure-pipeline-identity from ADO.
# Used only by pipelines/serverless/azure/azure-pipeline-identity/stack-setup.yml. That stack creates the
# pipelines' own service connections, variable group and state store, so this run signs in through the
# bootstrap service connection made by hand (docs/fresh-start-azure.md) and reads no variable group.
# Infrastructure only: no JFrog token, provider or variable. The apply waits on the ADO environment
# azure-pipeline-identity-<environment> and applies exactly the reviewed plan file.

parameters:
  - name: action
    type: string
  - name: environment
    type: string
  - name: inputs
    type: object
  - name: bootstrap_connection
    type: string

variables:
  - template: /pipelines/vars/azure-${{ parameters.environment }}.yml
  - name: PLAN_FILE
    value: $(Pipeline.Workspace)/plan/tfplan
  - name: PLAN_ACTION
    ${{ if eq(parameters.action, 'destroy') }}:
      value: plan-destroy
    ${{ else }}:
      value: plan

stages:
  - stage: plan
    displayName: Plan ${{ parameters.action }} azure-pipeline-identity
    jobs:
      - job: plan
        # AGENT_POOL in vars/<cloud>-<env>.yml: a self-hosted pool; empty: Microsoft-hosted ubuntu-24.04
        ${{ if ne(variables.AGENT_POOL, '') }}:
          pool:
            name: ${{ variables.AGENT_POOL }}
        ${{ else }}:
          pool:
            vmImage: ubuntu-24.04
        timeoutInMinutes: 30
        steps:
          - checkout: self
            fetchDepth: 1
          - bash: pipelines/scripts/install-terraform.sh
            displayName: Install Terraform $(TERRAFORM_VERSION)
          - bash: mkdir -p "$(Pipeline.Workspace)/plan"
            displayName: Prepare
          - task: AzureCLI@2
            name: tf
            displayName: terraform ${{ parameters.action }} plan (bootstrap connection)
            inputs:
              azureSubscription: ${{ parameters.bootstrap_connection }}
              scriptType: bash
              scriptLocation: scriptPath
              scriptPath: pipelines/scripts/identity-stack.sh
              arguments: $(PLAN_ACTION) ${{ parameters.environment }} $(PLAN_FILE)
            env:
              STACK_INPUTS: ${{ convertToJson(parameters.inputs) }}
          - publish: $(Pipeline.Workspace)/plan
            artifact: plan
            condition: and(succeeded(), eq(variables['tf.hasChanges'], 'true'))

  - stage: apply
    displayName: Apply
    dependsOn: plan
    condition: and(succeeded(), eq(dependencies.plan.outputs['plan.tf.hasChanges'], 'true'))
    jobs:
      - deployment: apply
        # AGENT_POOL in vars/<cloud>-<env>.yml: a self-hosted pool; empty: Microsoft-hosted ubuntu-24.04
        ${{ if ne(variables.AGENT_POOL, '') }}:
          pool:
            name: ${{ variables.AGENT_POOL }}
        ${{ else }}:
          pool:
            vmImage: ubuntu-24.04
        environment: azure-pipeline-identity-${{ parameters.environment }}
        timeoutInMinutes: 60
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  fetchDepth: 1
                - download: current
                  artifact: plan
                - bash: pipelines/scripts/install-terraform.sh
                  displayName: Install Terraform $(TERRAFORM_VERSION)
                - task: AzureCLI@2
                  displayName: terraform apply (bootstrap connection)
                  inputs:
                    azureSubscription: ${{ parameters.bootstrap_connection }}
                    scriptType: bash
                    scriptLocation: scriptPath
                    scriptPath: pipelines/scripts/identity-stack.sh
                    arguments: apply ${{ parameters.environment }} $(PLAN_FILE)
                  env:
                    STACK_INPUTS: ${{ convertToJson(parameters.inputs) }}
