# Applies the Azure workspaces the console proposes (terraform/workspaces/azure_<scope>).
# The console opens a pull request; merging it is the approval. For each
# workspace changed by the merge: terraform plan and apply with the setup
# connection, then wire every target with the console's Wire step.

trigger:
  branches:
    include: [main]
  paths:
    include: [terraform/workspaces/azure_*]
pr: none

parameters:
  - name: workspace
    displayName: Workspace to re-apply (empty = those changed by the last commit)
    type: string
    default: ' '
  - name: destroy
    displayName: Destroy the named workspace instead (its JFrog integration, mappings and identities); needs workspace
    type: boolean
    default: false

variables:
  - template: vars/azure-test.yml
  - template: vars/azure-test-jfrog.yml
  - group: jfrog-oidc-azure-test
  - group: jfrog-oidc-azure-test-jfrog   # JFrog OIDC (azure-jfrog-trust)

pool:
  vmImage: ubuntu-24.04

jobs:
  - job: onboard
    timeoutInMinutes: 60
    steps:
      - checkout: self
        fetchDepth: 2
      - bash: pipelines/scripts/install-terraform.sh
        displayName: Install Terraform $(TERRAFORM_VERSION)
      - task: AzureCLI@2
        displayName: Apply and wire (OIDC)
        inputs:
          azureSubscription: ${{ variables.SETUP_SERVICE_CONNECTION }}
          scriptType: bash
          scriptLocation: scriptPath
          scriptPath: pipelines/scripts/workspace-apply.sh
          arguments: azure ${{ parameters.workspace }}
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          WORKSPACE_DESTROY: ${{ parameters.destroy }}
          JFROG_OIDC_ADO_SERVICE_CONNECTION_ID: $(SETUP_SERVICE_CONNECTION_ID)
