# Applies the AWS workspaces the console proposes (terraform/workspaces/aws_<account>).
# The console opens a pull request; merging it is the approval. For each
# workspace changed by the merge: terraform plan and apply as ado-setup
# (AssumeRoleWithWebIdentity with the setup connection's OIDC token), then wire
# every target with the console's Wire step. Trust: terraform/stacks/ado-trust/aws.tf.

trigger:
  branches:
    include: [main]
  paths:
    include: [terraform/workspaces/aws_*]
pr: none

parameters:
  - name: workspace
    displayName: Workspace to re-apply (empty = those changed by the last commit)
    type: string
    default: ' '

variables:
  - template: vars/test.yml

pool:
  vmImage: ubuntu-24.04

jobs:
  - job: onboard
    timeoutInMinutes: 60
    steps:
      - checkout: self
        fetchDepth: 2
      - bash: pipelines/scripts/install-terraform.sh
        displayName: Install Terraform $(TERRAFORM_VERSION)
      # AzureCLI@2 only references the setup connection, so ADO issues its OIDC token;
      # AWS is reached with that token, not with an Azure login.
      - task: AzureCLI@2
        displayName: Apply and wire (OIDC)
        inputs:
          azureSubscription: ${{ variables.SETUP_SERVICE_CONNECTION }}
          scriptType: bash
          scriptLocation: scriptPath
          scriptPath: pipelines/scripts/workspace-apply.sh
          arguments: aws ${{ parameters.workspace }}
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          JFROG_OIDC_ADO_SERVICE_CONNECTION_ID: $(SETUP_SERVICE_CONNECTION_ID)
          AWS_SETUP_ROLE_ARN: $(AWS_SETUP_ROLE_ARN)
          AWS_REGION: $(AWS_REGION)
