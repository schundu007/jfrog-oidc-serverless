# Build and roll out ONE Azure serverless workload per run: the type (kind) and its name.
# Each type is its own stack in Setup with its own resource group; a run never touches another.
# Base images come through JFrog; every login comes from the service connection's OIDC token
# (no stored secrets). Trust: terraform/stacks/azure-foundation. Infrastructure: azure-stack-setup.yml.

trigger: none
pr: none

parameters:
  - name: environment
    type: string
    default: test
    values: [test]
  - name: kind
    displayName: Workload type
    type: string
    default: job
    values: [job, app, functions-aca, functions-premium, functions-flex]
  - name: workload
    displayName: Workload name (the stack's workload input)
    type: string
    default: artifact-reader

variables:
  - template: vars/azure-${{ parameters.environment }}.yml
  - group: jfrog-oidc-azure-${{ parameters.environment }}
  - name: KIND
    value: ${{ parameters.kind }}
  - name: WORKLOAD
    value: ${{ parameters.workload }}

pool:
  vmImage: ubuntu-24.04

jobs:
  - job: build_deploy
    displayName: Roll out ${{ parameters.kind }} ${{ parameters.workload }}
    timeoutInMinutes: 30
    steps:
      - checkout: self
        fetchDepth: 1
      - task: AzureCLI@2
        displayName: Roll out ${{ parameters.kind }} ${{ parameters.workload }} (OIDC)
        inputs:
          azureSubscription: ${{ variables.BUILD_SERVICE_CONNECTION }}
          scriptType: bash
          scriptLocation: scriptPath
          scriptPath: pipelines/scripts/azure-build-deploy.sh
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          JFROG_OIDC_ADO_SERVICE_CONNECTION_ID: $(BUILD_SERVICE_CONNECTION_ID)
