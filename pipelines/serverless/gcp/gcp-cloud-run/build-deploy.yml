# Cloud Run job: build and roll out this one workload (stack gcp-cloud-run). Nothing else is touched.
trigger: none
pr: none

parameters:
  - name: environment
    type: string
    default: test
    values: [test]
  - name: workload
    displayName: Workload name (the stack's workload input)
    type: string
    default: " "

extends:
  template: /pipelines/templates/gcp-build-deploy.yml
  parameters:
    kind: job
    workload: ${{ trim(parameters.workload) }}
    environment: ${{ parameters.environment }}
