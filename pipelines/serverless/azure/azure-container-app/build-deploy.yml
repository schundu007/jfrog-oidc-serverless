# Container App: build and roll out this one workload (stack azure-container-app). Nothing else is touched.
trigger: none
pr: none

parameters:
  - name: environment
    type: string
    default: test
    values: [test]
  - name: workload
    displayName: Workload name (the stack's workload input)
    type: string
    default: aca-jfrog-demo

extends:
  template: /pipelines/templates/azure-build-deploy.yml
  parameters:
    kind: app
    workload: ${{ parameters.workload }}
    environment: ${{ parameters.environment }}
