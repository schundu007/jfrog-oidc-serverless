# Web App: build and deploy this one workload's code (stack azure-web-app). Its runtime tags
# (Python, Java or .NET) pick the build; packages come only through JFrog. Nothing else is touched.
trigger: none
pr: none

parameters:
  - name: environment
    type: string
    default: test
    values: [test]
  - name: workload
    displayName: Workload name (the stack's workload input)
    type: string
    default: app-jfrog-demo

extends:
  template: /pipelines/templates/azure-build-deploy.yml
  parameters:
    kind: webapp
    workload: ${{ parameters.workload }}
    environment: ${{ parameters.environment }}
