# Web App (Linux or Windows; Python, Java or .NET): plan -> approve -> apply (or destroy) terraform/stacks/serverless/azure/azure-web-app only.
# The apply waits for approval on the ADO environment azure-web-app-<environment>.
trigger: none
pr: none

parameters:
  - name: action
    type: string
    default: apply
    values: [apply, destroy]
  - name: environment
    type: string
    default: test
    values: [test]
  # The stack's variables as JSON, as the Infrastructure page saves them (.console/setup/<env>/azure-web-app.tfvars.json).
  - name: inputs
    type: object
    default: {}
  # Where state lives: this cloud's pipeline identity inputs it derives from.
  - name: state
    type: object
    default: {}

extends:
  template: /pipelines/templates/azure-stack-setup.yml
  parameters:
    stack: azure-web-app
    action: ${{ parameters.action }}
    environment: ${{ parameters.environment }}
    inputs: ${{ parameters.inputs }}
    state: ${{ parameters.state }}
