# Applies the GCP workspaces the console proposes (terraform/workspaces/gcp_<scope>).
# The console opens a pull request; merging it is the approval. For each
# workspace changed by the merge: terraform plan and apply with the setup
# connection, then wire every target with the console's Wire step.

trigger:
  branches:
    include: [main]
  paths:
    include: [terraform/workspaces/gcp_*]
pr: none

parameters:
  # Add vars/gcp-<env>.yml and vars/gcp-<env>-jfrog.yml for another environment.
  - name: environment
    type: string
    default: test
    values: [test]
  - name: workspace
    displayName: Workspace to re-apply (empty = those changed by the last commit)
    type: string
    default: ' '
  - name: destroy
    displayName: Destroy the named workspace instead (its JFrog integration, mappings and identities); needs workspace
    type: boolean
    default: false

variables:
  - template: vars/gcp-${{ parameters.environment }}.yml
  - template: vars/gcp-${{ parameters.environment }}-jfrog.yml
  - group: jfrog-oidc-gcp-${{ parameters.environment }}
  - group: jfrog-oidc-gcp-${{ parameters.environment }}-jfrog   # JFrog OIDC (gcp-jfrog-trust)

jobs:
  - job: onboard
    # AGENT_POOL in vars/<cloud>-<env>.yml: a self-hosted pool; empty: Microsoft-hosted ubuntu-24.04
    ${{ if ne(variables.AGENT_POOL, '') }}:
      pool:
        name: ${{ variables.AGENT_POOL }}
    ${{ else }}:
      pool:
        vmImage: ubuntu-24.04
    timeoutInMinutes: 60
    steps:
      - checkout: self
        fetchDepth: 2
      - bash: pipelines/scripts/install-terraform.sh
        displayName: Install Terraform $(TERRAFORM_VERSION)
      # ADO issues the connection's OIDC token only to a job that references it; this
      # skipped task is that reference. Nothing signs in to Azure.
      - task: AzureCLI@2
        displayName: Reference the service connection
        condition: false
        inputs:
          azureSubscription: ${{ variables.SETUP_SERVICE_CONNECTION }}
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: 'true'
      - bash: bash pipelines/scripts/workspace-apply.sh gcp ${{ parameters.workspace }}
        displayName: Apply and wire (OIDC)
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          WORKSPACE_DESTROY: ${{ parameters.destroy }}
          JFROG_OIDC_ADO_SERVICE_CONNECTION_ID: $(SETUP_SERVICE_CONNECTION_ID)
          GCP_SETUP_SERVICE_ACCOUNT: $(GCP_SETUP_SERVICE_ACCOUNT)
