# Applies the GCP workspaces the console proposes (terraform/workspaces/gcp_<scope>).
# The console opens a pull request; merging it is the approval. For each
# workspace changed by the merge: terraform plan and apply with the setup
# connection, then wire every target with the console's Wire step.

trigger:
  branches:
    include: [main]
  paths:
    include: [terraform/workspaces/gcp_*]
pr: none

parameters:
  - name: workspace
    displayName: Workspace to re-apply (empty = those changed by the last commit)
    type: string
    default: ' '

variables:
  - template: vars/gcp-test.yml
  - group: jfrog-oidc-gcp-test

pool:
  vmImage: ubuntu-24.04

jobs:
  - job: onboard
    timeoutInMinutes: 60
    steps:
      - checkout: self
        fetchDepth: 2
      - bash: pipelines/scripts/install-terraform.sh
        displayName: Install Terraform $(TERRAFORM_VERSION)
      # ADO issues the connection's OIDC token only to a job that references it; this
      # skipped task is that reference. Nothing signs in to Azure.
      - task: AzureCLI@2
        displayName: Reference the service connection
        condition: false
        inputs:
          azureSubscription: ${{ variables.SETUP_SERVICE_CONNECTION }}
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: 'true'
      - bash: bash pipelines/scripts/workspace-apply.sh gcp ${{ parameters.workspace }}
        displayName: Apply and wire (OIDC)
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          JFROG_OIDC_ADO_SERVICE_CONNECTION_ID: $(SETUP_SERVICE_CONNECTION_ID)
          GCP_SETUP_SERVICE_ACCOUNT: $(GCP_SETUP_SERVICE_ACCOUNT)
