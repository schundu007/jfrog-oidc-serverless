# Build -> push -> deploy for a Cloud Run service workload (the job and function
# pipelines are gcp-build-deploy and gcp-function-deploy).
# The base image comes through JFrog and the image goes to Artifact Registry;
# both logins come from the service connection's OIDC token (no stored secrets).
# Trust: terraform/stacks/gcp-foundation and jfrog-ado-trust. Infrastructure: pipelines/gcp-stack-setup.yml.

trigger:
  branches:
    include: [main]
  paths:
    include: [apps/cloud-run-service, client/src, pipelines/gcp-service-build-deploy.yml, pipelines/scripts/gcp-build-deploy.sh, pipelines/scripts/oidc-login.sh]

pr: none

parameters:
  - name: environment
    type: string
    default: test
    values: [test]

variables:
  - template: vars/gcp-${{ parameters.environment }}.yml
  - group: jfrog-oidc-gcp-${{ parameters.environment }}
  - name: KIND
    value: service
  - name: APP
    value: cloud-run-service
  - name: WORKLOAD
    value: jfrog-svc-demo
  - name: BASE_IMAGE
    value: library/python:3.12-slim

pool:
  vmImage: ubuntu-24.04

jobs:
  - job: build_deploy
    displayName: Build, push, deploy
    timeoutInMinutes: 30
    steps:
      - checkout: self
        fetchDepth: 1
      # ADO issues the connection's OIDC token only to a job that references it; this
      # skipped task is that reference. Nothing signs in to Azure.
      - task: AzureCLI@2
        displayName: Reference the service connection
        condition: false
        inputs:
          azureSubscription: ${{ variables.BUILD_SERVICE_CONNECTION }}
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: 'true'
      - bash: bash pipelines/scripts/gcp-build-deploy.sh
        displayName: Build, push, deploy (OIDC)
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          JFROG_OIDC_ADO_SERVICE_CONNECTION_ID: $(BUILD_SERVICE_CONNECTION_ID)
          GCP_SERVICE_ACCOUNT: $(GCP_BUILD_SERVICE_ACCOUNT)
