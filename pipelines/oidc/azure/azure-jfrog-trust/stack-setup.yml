# Pipelines' JFrog trust (Azure): plan -> approve -> apply (or destroy) terraform/stacks/oidc/azure/azure-jfrog-trust,
# after an admin applies azure-pipeline-identity (Infrastructure page). Creates the JFrog integration ado-<org>-azure, the ado-build/ado-setup
# mappings, the reader group, the variable group jfrog-oidc-azure-<environment>-jfrog and the AKS credential
# provider's pipeline. First run: set the secret variable JFROG_ADMIN_TOKEN on this pipeline; delete it after.
# The apply waits on the ADO environment azure-jfrog-trust-<environment>.
trigger: none
pr: none

parameters:
  - name: action
    type: string
    default: apply
    values: [apply, destroy]
  - name: environment
    type: string
    default: test
    values: [test]
  # The stack's variables (terraform/stacks/oidc/azure/azure-jfrog-trust/variables.tf). jfrog_url is required.
  # Left out: ado_org, ado_project, ado_repository and azure_tenant_id come from this run.
  - name: inputs
    type: object
    default:
      jfrog_url: ""   # required: your JFrog platform origin, e.g. https://acme.jfrog.io
      jfrog_reader_group: ""
      console_operators: []
      ado_approvers: []

extends:
  template: /pipelines/templates/azure-trust-stack-setup.yml
  parameters:
    action: ${{ parameters.action }}
    environment: ${{ parameters.environment }}
    inputs: ${{ parameters.inputs }}
