# Plan -> apply (or destroy) for one Azure stack in terraform/stacks: azure-container-apps, aks-cluster.
# Infrastructure only (test targets); JFrog OIDC for workloads is <cloud>-workload-onboard.yml.
# The setup service connection's OIDC token gives a JFrog admin token (mapping
# ado-setup) for the run only, and the connection's Azure login. The apply stage targets the ADO
# environment "<stack>-<environment>" (approval) and applies exactly the reviewed plan file;
# action=destroy plans `terraform plan -destroy` and applies that the same way.

trigger: none
pr: none

parameters:
  - name: stack
    type: string
    default: azure-container-apps
    values: [azure-container-apps, aks-cluster]
  - name: action
    type: string
    default: apply
    values: [apply, destroy]
  - name: environment
    type: string
    default: test
    values: [test]
  # The stack's variables as JSON, as the Infrastructure page saves them (.console/setup/<env>/<stack>.tfvars.json).
  - name: inputs
    type: object
    default: {}
  # Where state lives: this cloud's foundation inputs it derives from (gcp_project_id; azure_subscription_id, ado_org, state_resource_group).
  - name: state
    type: object
    default: {}

variables:
  - template: vars/azure-${{ parameters.environment }}.yml
  - group: jfrog-oidc-azure-${{ parameters.environment }}
  - name: PLAN_FILE
    value: $(Pipeline.Workspace)/plan/tfplan
  - name: PLAN_ACTION
    ${{ if eq(parameters.action, 'destroy') }}:
      value: plan-destroy
    ${{ else }}:
      value: plan

pool:
  vmImage: ubuntu-24.04

stages:
  - stage: plan
    displayName: Plan ${{ parameters.action }} ${{ parameters.stack }}
    jobs:
      - job: plan
        timeoutInMinutes: 30
        steps:
          - checkout: self
            fetchDepth: 1
          - bash: pipelines/scripts/install-terraform.sh
            displayName: Install Terraform $(TERRAFORM_VERSION)
          - bash: mkdir -p "$(Pipeline.Workspace)/plan"
            displayName: Prepare
          - task: AzureCLI@2
            name: tf
            displayName: terraform ${{ parameters.action }} plan (OIDC)
            inputs:
              azureSubscription: ${{ variables.SETUP_SERVICE_CONNECTION }}
              scriptType: bash
              scriptLocation: scriptPath
              scriptPath: pipelines/scripts/terraform-stack.sh
              arguments: $(PLAN_ACTION) ${{ parameters.stack }} ${{ parameters.environment }} $(PLAN_FILE)
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
              JFROG_OIDC_ADO_SERVICE_CONNECTION_ID: $(SETUP_SERVICE_CONNECTION_ID)
              STACK_INPUTS: ${{ convertToJson(parameters.inputs) }}
              STACK_STATE: ${{ convertToJson(parameters.state) }}
          - publish: $(Pipeline.Workspace)/plan
            artifact: plan
            condition: and(succeeded(), eq(variables['tf.hasChanges'], 'true'))

  - stage: apply
    displayName: Apply
    dependsOn: plan
    condition: and(succeeded(), eq(dependencies.plan.outputs['plan.tf.hasChanges'], 'true'))
    jobs:
      - deployment: apply
        environment: ${{ parameters.stack }}-${{ parameters.environment }}
        timeoutInMinutes: 60
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  fetchDepth: 1
                - download: current
                  artifact: plan
                - bash: pipelines/scripts/install-terraform.sh
                  displayName: Install Terraform $(TERRAFORM_VERSION)
                - task: AzureCLI@2
                  displayName: terraform apply (OIDC)
                  inputs:
                    azureSubscription: ${{ variables.SETUP_SERVICE_CONNECTION }}
                    scriptType: bash
                    scriptLocation: scriptPath
                    scriptPath: pipelines/scripts/terraform-stack.sh
                    arguments: apply ${{ parameters.stack }} ${{ parameters.environment }} $(PLAN_FILE)
                  env:
                    SYSTEM_ACCESSTOKEN: $(System.AccessToken)
                    JFROG_OIDC_ADO_SERVICE_CONNECTION_ID: $(SETUP_SERVICE_CONNECTION_ID)
                    STACK_INPUTS: ${{ convertToJson(parameters.inputs) }}
                    STACK_STATE: ${{ convertToJson(parameters.state) }}
