# Build and roll out ONE Google Cloud serverless workload per run: the type (kind) and its name.
# Each type is its own stack in Setup (gcp-cloud-run, gcp-cloud-run-service, gcp-cloud-run-function)
# with its own service account; a run never touches another workload.
# Base images come through JFrog, images go to Artifact Registry; every login comes from the
# service connection's OIDC token (no stored secrets).
# Trust: terraform/stacks/gcp-foundation. Infrastructure: pipelines/gcp-stack-setup.yml.

trigger: none
pr: none

parameters:
  - name: environment
    type: string
    default: test
    values: [test]
  - name: kind
    displayName: Workload type
    type: string
    default: job
    values: [job, service, function]
  - name: workload
    displayName: Workload name (the stack's workload input)
    type: string
    default: artifact-reader

variables:
  - template: vars/gcp-${{ parameters.environment }}.yml
  - group: jfrog-oidc-gcp-${{ parameters.environment }}
  - name: BASE_IMAGE
    value: library/python:3.12-slim

pool:
  vmImage: ubuntu-24.04

jobs:
  - job: rollout
    displayName: Cloud Run ${{ parameters.kind }} ${{ parameters.workload }}
    timeoutInMinutes: 30
    variables:
      KIND: ${{ parameters.kind }}
      WORKLOAD: ${{ parameters.workload }}
      ${{ if eq(parameters.kind, 'job') }}:
        APP: artifact-reader
      ${{ if eq(parameters.kind, 'service') }}:
        APP: cloud-run-service
      ${{ if eq(parameters.kind, 'function') }}:
        APP: cloud-run-function
    steps:
      - checkout: self
        fetchDepth: 1
      # ADO issues the connection's OIDC token only to a job that references it; this
      # skipped task is that reference. Nothing signs in to Azure.
      - task: AzureCLI@2
        displayName: Reference the service connection
        condition: false
        inputs:
          azureSubscription: ${{ variables.BUILD_SERVICE_CONNECTION }}
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: 'true'
      - bash: bash pipelines/scripts/gcp-build-deploy.sh
        displayName: Roll out $(WORKLOAD) (OIDC)
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          JFROG_OIDC_ADO_SERVICE_CONNECTION_ID: $(BUILD_SERVICE_CONNECTION_ID)
          GCP_SERVICE_ACCOUNT: $(GCP_BUILD_SERVICE_ACCOUNT)
