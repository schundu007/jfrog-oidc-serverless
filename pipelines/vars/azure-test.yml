# Azure pipelines, test environment: ADO settings only, nothing shared with other clouds.
# Not credentials: every job authenticates with its service connection's OIDC token.
# Target values (JFrog URL and integration, project or subscription, identities) are not
# here: terraform/stacks/azure-foundation writes them (and the connection IDs) to the
# variable group jfrog-oidc-azure-<env>. Connection names are read at compile time, so they stay here.
variables:
  ENVIRONMENT: test
  BUILD_SERVICE_CONNECTION: jfrog-oidc-azure-build   # created by azure-foundation
  SETUP_SERVICE_CONNECTION: jfrog-oidc-azure-setup   # created by azure-foundation
  TERRAFORM_VERSION: 1.17.1
  JFROG_DOCKER_REMOTE: docker-remote
