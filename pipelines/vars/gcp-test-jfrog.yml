# Google Cloud pipelines, test environment: JFrog repository names. Read only by the JFrog OIDC
# runs (build-deploy, onboarding, the JFrog OIDC stacks); infrastructure runs never include it.
variables:
  JFROG_DOCKER_REMOTE: docker-remote
  # PyPI remote the function build vendors its packages from (no public PyPI in the build).
  JFROG_PYPI_REPO: pypi-remote
