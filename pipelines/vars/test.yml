# Only for the AWS and Knative pipelines, which are out of use (no foundation stack).
# GCP and Azure pipelines use vars/gcp-<env>.yml and vars/azure-<env>.yml.
variables:
  ENVIRONMENT: test
  # No connections: each cloud owns its own, written by its foundation stack, and
  # AWS and Knative have none yet.
  BUILD_SERVICE_CONNECTION: ""
  SETUP_SERVICE_CONNECTION: ""
  TERRAFORM_VERSION: 1.17.1

  JFROG_DOCKER_REMOTE: docker-remote

  # Knative (OpenShift Serverless or any Knative cluster): a Kubernetes service connection.
  # No cluster in the test environment yet; the names are what the pipeline expects.
  KUBE_SERVICE_CONNECTION: knative-cluster
  KUBE_CONTEXT: ""
