<!doctype html>
<html lang="en" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JFrog OIDC Console</title>
  <link rel="stylesheet" href="/serverless/static/styles.css">
  <link rel="stylesheet" href="/static/setup.css">
  <link rel="stylesheet" href="/serverless/static/azure.css">
  <script type="module" src="/static/app.js"></script>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <a class="brand" href="/"><svg class="logo" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 1.5l7.4 4.25v8.5L10 18.5l-7.4-4.25v-8.5z"/><path class="logo-in" d="M10 6l3.5 2v4L10 14l-3.5-2V8z"/></svg><span>JFrog OIDC <b class="brand-accent">Console</b></span></a>
    <span class="pill bad" id="session-state" hidden></span>
  </header>
  <aside class="sidenav"><script src="/serverless/static/shell.js"></script></aside>
  <div class="main-col">
  <div id="auth-banner" class="banner error" role="alert" hidden>
    <form id="auth-form" class="auth-form" autocomplete="off">
      <input id="auth-input" type="password" spellcheck="false" autocomplete="off" aria-label="Console link" placeholder="http://127.0.0.1:8760/#t=…">
      <button type="submit" class="primary">Sign in</button>
    </form>
  </div>
  <main>
    <header class="home-title">
      <span class="home-logo" id="page-logo" aria-hidden="true"></span>
      <h1 id="page-title">Infrastructure</h1>
    </header>
    <div class="blade-cmds" role="toolbar" aria-label="Stacks">
      <button id="refresh" type="button" class="blade-cmd"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 10a6 6 0 1 1-1.8-4.3M16 4v3.5h-3.5"/></svg>Refresh</button>
      <a class="blade-cmd" href="/runs?area=infrastructure"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 6h12M4 10h12M4 14h7"/></svg>Runs</a>
    </div>
    <section class="ess" aria-labelledby="ess-h">
      <button type="button" class="ess-fold" id="ess-h" aria-expanded="true" aria-controls="ess-body">Essentials</button>
      <div class="ess-body" id="ess-body"><dl class="ess-col" id="ess-left"></dl><dl class="ess-col" id="ess-right"></dl></div>
    </section>
    <div id="filters"></div>
    <p id="count" class="blade-count"></p>
    <div id="groups"></div>
    <p id="none" class="blade-empty" hidden>No stacks match the filters</p>
  </main>
  <aside id="flyout" class="flyout" role="dialog" aria-labelledby="flyout-title" hidden>
    <div class="flyout-head">
      <h2 id="flyout-title"></h2>
      <span id="flyout-status"></span>
      <button type="button" id="flyout-close" class="icon-btn" aria-label="Close panel" title="Close"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg></button>
    </div>
    <div id="flyout-body" class="flyout-body"></div>
  </aside>
  </div>
</div>
</body>
</html>
