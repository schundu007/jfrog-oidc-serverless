<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KCP Console</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script type="module" src="/static/app.js"></script>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand" id="brand-own"><span class="logo" aria-hidden="true">◆</span><span>KCP Console</span></div>
    <div class="brand" id="brand-portal" hidden><svg class="logo-hex" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 1.5l7.4 4.25v8.5L10 18.5l-7.4-4.25v-8.5z"/><path class="logo-in" d="M10 6l3.5 2v4L10 14l-3.5-2V8z"/></svg><span>JFrog OIDC Console</span></div>
    <span class="section-title" id="section-title" hidden>Kubernetes</span>
    <div class="config-pick" id="config-pick" hidden>
      <label for="config-select" class="small">Cluster</label>
      <select id="config-select"></select>
    </div>
    <span class="pill" id="mode-pill" hidden></span>
  </header>
  <aside class="sidenav">
    <nav id="sidenav" aria-label="Sections" hidden>
      <div class="nav-group">Clusters</div>
      <a class="nav-item" href="/clusters/aks" data-cloud="aks"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 15 9 3l8 12z"/></svg><span>Azure AKS</span></a>
      <a class="nav-item" href="/clusters/gke" data-cloud="gke"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2 17 6v8l-7 4-7-4V6z"/></svg><span>Google GKE</span></a>
      <a class="nav-item" href="/clusters/eks" data-cloud="eks"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 4h14v12H3zM3 8h14"/></svg><span>AWS EKS</span></a>
      <a class="nav-item" href="/clusters/openshift" data-cloud="openshift"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="M5 13l10-6"/></svg><span>OpenShift</span></a>
      <a class="nav-item section-switch" id="section-switch" href="/serverless" hidden><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h12M11 5l5 5-5 5"/></svg><span>Serverless</span></a>
    </nav>
  </aside>
  <div class="main-col">
  <div id="auth-banner" class="banner error" role="alert" hidden>
    <p>Not signed in. Paste the console URL (it ends in #t=…). If the console was started in the background,
      get it with <code>python3 -m kcp_console --print-url</code>.</p>
    <form id="auth-form" class="auth-form" autocomplete="off">
      <input id="auth-input" type="password" spellcheck="false" autocomplete="off" aria-label="Console link"
        placeholder="http://127.0.0.1:8766/#t=…">
      <button type="submit" class="primary">Sign in</button>
    </form>
  </div>
    <main>
    <section id="panel-overview" hidden></section>
    <section id="panel-configure" hidden></section>
    </main>
  </div>
</div>
</body>
</html>
