<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KCP Console</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script type="module" src="/static/app.js"></script>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand"><span class="logo" aria-hidden="true">◆</span><span>KCP Console</span></div>
    <div class="config-pick" id="config-pick" hidden>
      <label for="config-select" class="small">Cluster</label>
      <select id="config-select"></select>
    </div>
    <span class="pill" id="mode-pill" hidden></span>
  </header>
  <aside class="sidenav">
    <nav id="sidenav" aria-label="Sections" hidden>
      <button type="button" class="nav-item" id="nav-overview"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14"/></svg><span>Clusters</span></button>
      <button type="button" class="nav-item" id="nav-configure"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3"/><path d="M10 2v3M10 15v3M2 10h3M15 10h3M4.3 4.3l2.1 2.1M13.6 13.6l2.1 2.1M4.3 15.7l2.1-2.1M13.6 6.4l2.1-2.1"/></svg><span>Configure</span></button>
      <button type="button" class="nav-item" id="nav-runs"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 5h12M4 10h12M4 15h8"/></svg><span>Runs</span></button>
    </nav>
  </aside>
  <div class="main-col">
  <div id="auth-banner" class="banner error" role="alert" hidden>
    <p>Not signed in. Paste the console URL (it ends in #t=…). If the console was started in the background,
      get it with <code>python3 -m kcp_console --print-url</code>.</p>
    <form id="auth-form" class="auth-form" autocomplete="off">
      <input id="auth-input" type="password" spellcheck="false" autocomplete="off" aria-label="Console link"
        placeholder="http://127.0.0.1:8766/#t=…">
      <button type="submit" class="primary">Sign in</button>
    </form>
  </div>
    <main>
    <section id="panel-overview" hidden></section>
    <section id="panel-configure" hidden></section>
    <section id="panel-runs" hidden></section>
    </main>
  </div>
</div>
</body>
</html>
