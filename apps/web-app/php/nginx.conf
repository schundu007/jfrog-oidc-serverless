# App Service Linux PHP: nginx in front of php-fpm. Every path goes to index.php; src/ and tests/
# are never served. startup.sh copies this over the image's default site.
server {
    listen 8080;
    listen [::]:8080;
    root /home/site/wwwroot;
    index index.php;
    port_in_redirect off;

    location ~ ^/(src|tests)(/|$) { return 404; }
    location ~ /\. { return 404; }

    location / {
        try_files /nonexistent /index.php$is_args$args;
    }

    location = /index.php {
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_read_timeout 120;
    }
}
