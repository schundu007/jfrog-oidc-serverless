<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}JFrog browser{% endblock %}</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
  <header class="top">
    <a class="brand" href="{{ url_for('home') }}">JFrog browser</a>
    <nav>
      <a href="{{ url_for('home') }}">Repositories</a>
      {% if settings.home_path %}<a href="{{ url_for('browse', repo_path=settings.home_path) }}">Home folder</a>{% endif %}
      <a href="{{ url_for('api_identity') }}">API</a>
      <a href="{{ url_for('healthz_jfrog') }}">Health</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    <span>Signed in to JFrog with a short-lived OIDC token &middot; no stored secret</span>
    <span>version {{ settings.version }}</span>
  </footer>
</body>
</html>
