[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jfrog-oidc"
version = "0.1.0"
description = "Short-lived JFrog tokens for Cloud Run, Azure Container Apps and Azure Functions via OIDC token exchange"
requires-python = ">=3.9"
dependencies = []  # stdlib only, so it adds nothing to cold starts

[tool.setuptools.packages.find]
where = ["src"]
